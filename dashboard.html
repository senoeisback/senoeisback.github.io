<script>
  // 🧠 USER HANDLING — always allows guests
  let user = localStorage.getItem("loggedInUser");
  if (!user) {
    user = "Guest";
    localStorage.setItem("loggedInUser", "Guest");
  }

  document.getElementById("welcome").textContent = `Welcome, ${user}!`;

  // 🕒 LIVE TIME DISPLAY
  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });
    document.getElementById("time").textContent = timeStr;
  }
  setInterval(updateTime, 1000);
  updateTime();

  // 📝 EXAMPLE ASSIGNMENTS
  const assignments = [
    { class: "Math", title: "Chapter 3 Homework", due: "2025-10-20", desc: "Page 42, #1–10" },
    { class: "English", title: "Essay Draft", due: "2025-10-18", desc: "Shakespeare analysis" },
    { class: "Science", title: "Lab Report", due: "2025-10-21", desc: "Newton’s Laws experiment" },
  ];

  const container = document.getElementById("assignments");
  container.innerHTML = ""; // clear if already rendered
  assignments.forEach(a => {
    const card = document.createElement("div");
    card.className = "bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border dark:border-gray-700";
    card.innerHTML = `
      <h3 class="text-lg font-semibold">${a.title}</h3>
      <p class="text-gray-600 dark:text-gray-300">${a.desc}</p>
      <p class="text-sm text-gray-400 mt-2">Due: ${a.due}</p>
    `;
    container.appendChild(card);
  });

  // 🎨 THEME HANDLING
  const themeToggle = document.getElementById("themeToggle");

  // Set initial theme state
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
    if (themeToggle) themeToggle.checked = true;
  }

  // Toggle theme when switch changes
  themeToggle?.addEventListener("change", (e) => {
    if (e.target.checked) {
      document.documentElement.classList.add("dark");
      localStorage.setItem("theme", "dark");
    } else {
      document.documentElement.classList.remove("dark");
      localStorage.setItem("theme", "light");
    }
  });

  // ⚙️ SETTINGS MODAL
  function openSettings() {
    document.getElementById("settingsModal").classList.remove("hidden");
  }

  function closeSettings() {
    document.getElementById("settingsModal").classList.add("hidden");
  }

  // 🚪 LOGOUT — now just switches to Guest mode (no redirect)
  function logout() {
    localStorage.setItem("loggedInUser", "Guest");
    document.getElementById("welcome").textContent = "Welcome, Guest!";
  }

  // Expose modal and logout functions globally
  window.openSettings = openSettings;
  window.closeSettings = closeSettings;
  window.logout = logout;
</script>
