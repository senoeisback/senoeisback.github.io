<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — StudySpace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ---------------- Dynamic Island ---------------- */
    .dyn-island {
      width: 120px;
      height: 38px;
      border-radius: 9999px;
      background-color: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      transition: width 260ms cubic-bezier(.2,.9,.2,1), height 220ms, box-shadow 200ms;
      cursor: grab;
      position: relative;
      overflow: hidden;
    }

    .dyn-island::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(79,70,229,0.3) 0%, rgba(79,70,229,0) 70%);
      opacity: 0.4;
      animation: breathe 4s ease-in-out infinite;
      border-radius: 9999px;
      pointer-events: none;
    }

    @keyframes breathe {
      0%,100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.6; }
    }

    .dyn-island:hover {
      width: 180px;
      height: 48px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .dyn-island .time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-weight: 700;
      letter-spacing: 0.6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      z-index: 10;
    }

    .island-wrap {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      z-index: 60;
    }

    .island-wrap.dragging {
      cursor: grabbing;
    }

    /* ---------------- Right Sidebar ---------------- */
    .sidebar-wrapper {
      position: fixed;
      top: 0;
      right: 0;
      width: 16px; /* hover strip width */
      height: 100%;
      z-index: 40;
    }

    .sidebar {
      position: fixed;
      right: -240px;
      top: 0;
      width: 240px;
      height: 100%;
      background-color: rgba(255,255,255,0.85);
      color: black;
      box-shadow: -2px 0 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      transition: right 0.3s ease, background-color 0.3s ease;
      backdrop-filter: blur(10px);
      border-left: 1px solid rgba(0,0,0,0.1);
      z-index: 50;
    }

    .dark .sidebar {
      background-color: rgba(31,41,55,0.85);
      color: #f9fafb;
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-wrapper:hover .sidebar {
      right: 0;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

  <!-- ---------------- Dynamic Island ---------------- -->
  <div class="island-wrap" id="islandWrap">
    <div id="dynIsland" class="dyn-island">
      <div class="time" id="islandTime">--:--:--</div>
    </div>
  </div>

  <!-- ---------------- Sidebar Hover Wrapper ---------------- -->
  <div class="sidebar-wrapper">
    <aside class="sidebar">
      <div>
        <h1 class="text-2xl font-bold mb-4 text-indigo-700 dark:text-indigo-300">StudySpace</h1>
        <nav class="space-y-2">
          <a href="dashboard.html" class="block p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">🏠 Dashboard</a>
          <a href="assignments.html" class="block p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">📝 Assignments</a>
          <a href="#" onclick="openSettings()" class="block p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">⚙️ Settings</a>
        </nav>
      </div>
      <button onclick="logout()" class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg">Logout</button>
    </aside>
  </div>

  <!-- ---------------- Main ---------------- -->
  <main class="flex-1 p-8 flex flex-col items-center justify-center text-center">
    <h2 id="welcome" class="text-4xl font-semibold mb-2">Welcome!</h2>
    <p class="text-gray-500 dark:text-gray-400 text-lg mb-6">Your all-in-one school workspace</p>
    <div id="time" class="text-2xl font-mono font-medium"></div>
  </main>

  <!-- ---------------- Settings Modal ---------------- -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg w-80">
      <h3 class="text-xl font-semibold mb-4">Settings</h3>
      <div class="flex items-center justify-between mb-4">
        <span>Dark Mode</span>
        <label class="inline-flex items-center cursor-pointer">
          <input type="checkbox" id="themeToggle" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:bg-indigo-600 relative">
            <span class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-all peer-checked:translate-x-5"></span>
          </div>
        </label>
      </div>
      <button onclick="closeSettings()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg">Close</button>
    </div>
  </div>

  <!-- ---------------- Script ---------------- -->
  <script>
    // ---------------- Guest Mode ----------------
    let user = localStorage.getItem("loggedInUser") || "Guest";
    localStorage.setItem("loggedInUser", user);
    document.getElementById("welcome").textContent = `Welcome, ${user}!`;

    // ---------------- Live Time ----------------
    function updateTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      document.getElementById("time").textContent = timeStr;
      document.getElementById("islandTime").textContent = timeStr;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // ---------------- Theme Toggle ----------------
    const themeToggle = document.getElementById("themeToggle");
    if(localStorage.getItem('theme')==='dark'){
      document.documentElement.classList.add('dark'); 
      themeToggle.checked=true;
    }
    themeToggle?.addEventListener('change', e=>{
      if(e.target.checked){
        document.documentElement.classList.add('dark'); 
        localStorage.setItem('theme','dark');
      } else {
        document.documentElement.classList.remove('dark'); 
        localStorage.setItem('theme','light');
      }
    });

    // ---------------- Settings Modal + Logout ----------------
    function openSettings(){ document.getElementById("settingsModal").classList.remove("hidden"); }
    function closeSettings(){ document.getElementById("settingsModal").classList.add("hidden"); }
    function logout(){
      localStorage.setItem("loggedInUser","Guest");
      document.getElementById("welcome").textContent="Welcome, Guest!";
    }
    window.openSettings=openSettings; window.closeSettings=closeSettings; window.logout=logout;

    // ---------------- Dynamic Island Drag ----------------
    const islandWrap = document.getElementById("islandWrap");
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    islandWrap.addEventListener("mousedown", (e) => {
      isDragging = true;
      offsetX = e.clientX - islandWrap.offsetLeft;
      offsetY = e.clientY - islandWrap.offsetTop;
      islandWrap.classList.add("dragging");
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
      islandWrap.classList.remove("dragging");
    });

    document.addEventListener("mousemove", (e) => {
      if (isDragging) {
        let x = e.clientX - offsetX;
        let y = e.clientY - offsetY;

        // Constrain within viewport
        const maxX = window.innerWidth - islandWrap.offsetWidth;
        const maxY = window.innerHeight - islandWrap.offsetHeight;
        x = Math.max(0, Math.min(x, maxX));
        y = Math.max(0, Math.min(y, maxY));

        islandWrap.style.left = `${x}px`;
        islandWrap.style.top = `${y}px`;
        islandWrap.style.transform = `none`;
      }
    });
  </script>
</body>
</html>
