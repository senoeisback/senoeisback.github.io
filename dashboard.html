<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CopperMier — Dashboard</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Comfortaa Font -->
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0; font-family:'Comfortaa', cursive; overflow:hidden;
  background-color:#121212; color:white; --accent-color:#00ffff; --text-color:#ffffff;
}

/* Dynamic Island keeps Fira Code */
.dyn-island{
  font-family:'Fira Code', monospace;
  width:120px;height:38px;border-radius:9999px;background-color:#000;color:var(--accent-color);
  display:flex;align-items:center;justify-content:center;padding:6px 12px;
  transition:width 260ms cubic-bezier(.2,.9,.2,1), height 220ms, box-shadow 200ms;
  cursor:grab;position:relative;overflow:hidden;font-size:0.9rem;font-weight:700;letter-spacing:0.6px;
}
.dyn-island::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle, rgba(0,255,255,0.3) 0%, rgba(0,255,255,0) 70%);
  opacity:0.4; animation:breathe 4s ease-in-out infinite; border-radius:9999px; pointer-events:none;
}
@keyframes breathe{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(1.05);opacity:0.6}}
.dyn-island:hover{width:180px;height:48px;box-shadow:0 10px 30px var(--accent-color)80}
.dyn-island .time{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;z-index:10;}
.island-wrap{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:60;}
.island-wrap.dragging{cursor:grabbing;}

/* Sidebar */
.sidebar-wrapper{position:fixed;top:0;right:0;width:16px;height:100%;z-index:40;}
.sidebar{position:fixed;right:-240px;top:0;width:240px;height:100%;background-color: rgba(0,0,0,0.7);
color:var(--accent-color);box-shadow:-2px 0 20px rgba(0,255,255,0.2);display:flex;flex-direction:column;
justify-content:space-between;padding:1rem;transition:right 0.3s ease, background-color 0.3s ease;
backdrop-filter:blur(10px);border-left:1px solid rgba(0,255,255,0.3);z-index:50;}
.sidebar-wrapper:hover .sidebar{right:0;}

/* Widgets */
.widget{
  position:absolute;width:220px;min-height:120px;background-color:rgba(0,0,0,0.6);
  color:var(--text-color);backdrop-filter:blur(10px);border-radius:1rem;padding:1rem;
  box-shadow:0 10px 25px rgba(0,255,255,0.3);cursor:grab;overflow:hidden;
}
.widget.dragging{cursor:grabbing;}
</style>
</head>
<body>

<!-- Dynamic Island -->
<div class="island-wrap" id="islandWrap">
  <div id="dynIsland" class="dyn-island">
    <div class="time" id="islandTime">--:--:--</div>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar-wrapper">
  <aside class="sidebar">
    <div>
      <h1 class="text-2xl font-bold mb-4" style="color: var(--accent-color)">CopperMier</h1>
      <nav class="space-y-2">
        <a href="dashboard.html" class="block p-2 rounded hover:bg-black/30">🏠 Dashboard</a>
        <a href="assignments.html" class="block p-2 rounded hover:bg-black/30">📝 Assignments</a>
        <a href="#" onclick="openSettings()" class="block p-2 rounded hover:bg-black/30">⚙️ Settings</a>
      </nav>
    </div>
    <button onclick="logout()" class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg">Logout</button>
  </aside>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-black/80 p-6 rounded-2xl shadow-lg w-80 text-white">
    <h3 class="text-xl font-semibold mb-4" style="color: var(--accent-color)">Settings</h3>

    <!-- Theme toggle -->
    <div class="flex items-center justify-between mb-4">
      <span>Dark Mode</span>
      <label class="inline-flex items-center cursor-pointer">
        <input type="checkbox" id="themeToggle" class="sr-only peer">
        <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer-checked:bg-cyan-400 relative">
          <span class="absolute left-1 top-1 bg-black w-4 h-4 rounded-full transition-all peer-checked:translate-x-5"></span>
        </div>
      </label>
    </div>

    <!-- Accent Color Picker -->
    <div class="mb-4">
      <label class="block mb-1">Accent Color</label>
      <input type="color" id="accentColorPicker" value="#00ffff" class="w-full h-8 cursor-pointer">
    </div>

    <!-- Text Color Picker -->
    <div class="mb-4">
      <label class="block mb-1">Text Color</label>
      <input type="color" id="textColorPicker" value="#ffffff" class="w-full h-8 cursor-pointer">
    </div>

    <!-- Background Media -->
    <div class="mb-4">
      <label class="block mb-1">Background Media (URL)</label>
      <input type="text" id="backgroundMedia" placeholder="Paste image/video URL" class="w-full p-1 rounded text-black">
    </div>
    <button id="applyBackground" class="bg-cyan-400 text-black px-4 py-2 rounded w-full mb-2">Apply</button>
    <button onclick="closeSettings()" class="w-full bg-cyan-500 text-black py-2 rounded">Close</button>
  </div>
</div>

<script>
// USER & TIME
let user=localStorage.getItem("loggedInUser")||"Guest";
localStorage.setItem("loggedInUser",user);
function updateTime(){ const now=new Date(); document.getElementById("islandTime").textContent=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
setInterval(updateTime,1000); updateTime();

// THEME & SETTINGS
const themeToggle=document.getElementById("themeToggle");
if(localStorage.getItem('theme')==='dark'){ document.documentElement.classList.add('dark'); themeToggle.checked=true; }
themeToggle?.addEventListener('change',e=>{
  if(e.target.checked){ document.documentElement.classList.add('dark'); localStorage.setItem('theme','dark'); }
  else{ document.documentElement.classList.remove('dark'); localStorage.setItem('theme','light'); }
});
function openSettings(){ document.getElementById("settingsModal").classList.remove("hidden"); }
function closeSettings(){ document.getElementById("settingsModal").classList.add("hidden"); }
function logout(){ localStorage.setItem("loggedInUser","Guest"); alert("Logged out! Guest mode activated."); }
window.openSettings=openSettings; window.closeSettings=closeSettings; window.logout=logout;

// DYNAMIC ISLAND DRAG & SAVE
let islandPos=JSON.parse(localStorage.getItem('islandPos')) || { top:14, left:(window.innerWidth/2 - 60) };
const islandWrap=document.getElementById("islandWrap");
islandWrap.style.top=islandPos.top+'px';
islandWrap.style.left=islandPos.left+'px';
let isDragging=false,offsetX=0,offsetY=0;

islandWrap.addEventListener("mousedown", e=>{
  isDragging=true;
  offsetX=e.clientX-islandWrap.offsetLeft;
  offsetY=e.clientY-islandWrap.offsetTop;
  islandWrap.classList.add("dragging");
});

document.addEventListener("mouseup", ()=>{
  if(isDragging){
    isDragging=false;
    islandWrap.classList.remove("dragging");
    localStorage.setItem('islandPos', JSON.stringify({ top: parseInt(islandWrap.style.top), left: parseInt(islandWrap.style.left) }));
  }
});

document.addEventListener("mousemove", e=>{
  if(isDragging){
    let x=e.clientX-offsetX, y=e.clientY-offsetY;
    const GRID=20;
    x=Math.round(x/GRID)*GRID; y=Math.round(y/GRID)*GRID;
    x=Math.max(0,Math.min(x,window.innerWidth-islandWrap.offsetWidth));
    y=Math.max(0,Math.min(y,window.innerHeight-islandWrap.offsetHeight));
    islandWrap.style.left=x+'px';
    islandWrap.style.top=y+'px';
    localStorage.setItem('islandPos', JSON.stringify({ top:y, left:x }));
  }
});

// WIDGETS
const GRID_SIZE=20;
let widgets=JSON.parse(localStorage.getItem('widgets')) || [{ id:'assignmentsWidget', top:100, left:100, title:'Assignments', content:'', width:220, height:120 }];

function createWidget({id, top, left, title, content, width=220, height=120}){
  const w=document.createElement('div'); w.className='widget'; w.id=id;
  w.style.top=top+'px'; w.style.left=left+'px'; w.style.width=width+'px'; w.style.height=height+'px';
  w.innerHTML=`<h3 class="text-lg font-semibold mb-2">${title}</h3><p class="text-sm">${content}</p>`;
  document.body.appendChild(w); makeDraggable(id);
}

function makeDraggable(widgetId){
  const w=document.getElementById(widgetId);
  let dragging=false, wx=0, wy=0;
  w.addEventListener("mousedown", e=>{ dragging=true; wx=e.clientX-w.offsetLeft; wy=e.clientY-w.offsetTop; w.classList.add("dragging");});
  document.addEventListener("mouseup", ()=>{ dragging=false; w.classList.remove("dragging"); });
  document.addEventListener("mousemove", e=>{
    if(dragging){
      let x=e.clientX-wx, y=e.clientY-wy;
      x=Math.round(x/GRID_SIZE)*GRID_SIZE; y=Math.round(y/GRID_SIZE)*GRID_SIZE;
      x=Math.max(0, Math.min(x, window.innerWidth-w.offsetWidth));
      y=Math.max(0, Math.min(y, window.innerHeight-w.offsetHeight));
      w.style.left=`${x}px`; w.style.top=`${y}px`;
      const index = widgets.findIndex(widget => widget.id === widgetId);
      if(index !== -1){
        widgets[index].top = y;
        widgets[index].left = x;
        localStorage.setItem('widgets', JSON.stringify(widgets));
      }
    }
  });
}

// Load widgets
widgets.forEach(createWidget);

// ACCENT COLOR
const accentPicker=document.getElementById('accentColorPicker');
function updateAccentColor(color){
  document.documentElement.style.setProperty('--accent-color', color);
  document.querySelector('.dyn-island').style.boxShadow=`0 10px 30px ${color}80`;
  document.querySelector('.sidebar').style.borderLeftColor=`${color}50`;
  document.querySelector('.sidebar').style.color=color;
}
const savedAccent=localStorage.getItem('accentColor');
if(savedAccent){ accentPicker.value=savedAccent; updateAccentColor(savedAccent); }
accentPicker.addEventListener("input", e=>{ updateAccentColor(e.target.value); localStorage.setItem('accentColor',e.target.value); });

// TEXT COLOR
const textColorPicker=document.getElementById('textColorPicker');
function updateTextColor(color){
  document.documentElement.style.setProperty('--text-color',color);
  document.querySelectorAll('.widget').forEach(w=>{ w.style.color=color; });
}
const savedTextColor=localStorage.getItem("textColor");
if(savedTextColor){ textColorPicker.value=savedTextColor; updateTextColor(savedTextColor); }
textColorPicker.addEventListener("input", e=>{ updateTextColor(e.target.value); localStorage.setItem('textColor',e.target.value); });

// BACKGROUND IMAGE/VIDEO
const bgInput=document.getElementById("backgroundMedia");
const applyBgBtn=document.getElementById("applyBackground");
applyBgBtn.addEventListener("click",()=>{
  const url=bgInput.value.trim();
  if(!url){ document.body.style.background="#121212"; document.body.style.backgroundSize="cover"; return; }
  if(url.match(/\.(mp4|webm|ogg)$/i)){
    let video=document.getElementById("bgVideo");
    if(!video){ video=document.createElement("video"); video.id="bgVideo"; video.autoplay=true; video.loop=true; video.muted=true;
      video.style.position="fixed"; video.style.top="0"; video.style.left="0"; video.style.width="100%"; video.style.height="100%";
      video.style.objectFit="cover"; video.style.zIndex="-1"; document.body.appendChild(video); }
    video.src=url;
  } else { document.body.style.background=`url(${url}) no-repeat center center fixed`; document.body.style.backgroundSize="cover"; }
  localStorage.setItem("backgroundMedia",url);
});
const savedBg=localStorage.getItem("backgroundMedia");
if(savedBg){ bgInput.value=savedBg; applyBgBtn.click(); }

</script>
</body>
</html>
