<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CopperMier — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Base */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background-color: #121212;
    color: white;
    --accent-color: #00ffff;
    --text-color: #ffffff;
  }

  /* Dynamic Island (keeps Fira Code) */
  .dyn-island{
    font-family: 'Fira Code', monospace;
    width: 120px;
    height: 38px;
    border-radius: 9999px;
    background-color: #000;
    color: var(--accent-color);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    transition: width 260ms cubic-bezier(.2,.9,.2,1), height 220ms, box-shadow 200ms, background 200ms;
    cursor: grab;
    position: relative;
    overflow: hidden;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .dyn-island::before{
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0,255,255,0.18) 0%, rgba(0,255,255,0) 70%);
    opacity: 0.35;
    animation: breathe 4s ease-in-out infinite;
    border-radius: 9999px;
    pointer-events: none;
  }
  @keyframes breathe { 0%,100%{transform:scale(1);opacity:0.35}50%{transform:scale(1.04);opacity:0.55} }
  .dyn-island:hover { width: 180px; height: 48px; box-shadow: 0 10px 30px var(--accent-color)80; }
  .dyn-island .time { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 10; }
  .island-wrap { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; }
  .island-wrap.dragging { cursor: grabbing; }

  /* Sidebar */
  .sidebar-wrapper{ position: fixed; top:0; right:0; width:16px; height:100%; z-index:40; }
  .sidebar{
    position: fixed; right:-240px; top:0; width:240px; height:100%;
    background-color: rgba(0,0,0,0.7); color:var(--accent-color);
    box-shadow:-2px 0 20px rgba(0,255,255,0.12); display:flex; flex-direction:column;
    justify-content:space-between; padding:1rem; transition:right .28s ease; backdrop-filter:blur(10px);
    border-left:1px solid rgba(0,255,255,0.12); z-index:50;
  }
  .sidebar-wrapper:hover .sidebar { right: 0; }

  /* Widgets */
  .widget{
    position: absolute;
    width: 220px;
    min-height: 120px;
    background-color: rgba(0,0,0,0.6);
    color: var(--text-color);
    backdrop-filter: blur(10px);
    border-radius: 1rem;
    padding: 1rem;
    box-shadow: 0 10px 25px rgba(0,255,255,0.12);
    cursor: grab;
    overflow: hidden;
  }
  .widget.dragging{ cursor: grabbing; }

  /* Settings modal basics */
  .hidden { display: none; }
</style>
</head>
<body>

  <!-- Dynamic Island -->
  <div class="island-wrap" id="islandWrap">
    <div id="dynIsland" class="dyn-island">
      <div id="islandTime" class="time">--:--:--</div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar-wrapper">
    <aside class="sidebar">
      <div>
        <h1 class="text-2xl font-bold mb-4" style="color:var(--accent-color)">CopperMier</h1>
        <nav class="space-y-2">
          <a href="dashboard.html" class="block p-2 rounded hover:bg-black/30">🏠 Dashboard</a>
          <a href="assignments.html" class="block p-2 rounded hover:bg-black/30">📝 Assignments</a>
          <a href="#" onclick="openSettings()" class="block p-2 rounded hover:bg-black/30">⚙️ Settings</a>
        </nav>
      </div>
      <button onclick="logout()" class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg">Logout</button>
    </aside>
  </div>

  <!-- Predefined assignments widget -->
  <div class="widget" id="assignmentsWidget" style="top:100px; left:100px;">
    <h3 class="text-lg font-semibold mb-2">Assignments</h3>
    <p class="text-sm">Empty — add later</p>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-black/80 p-6 rounded-2xl shadow-lg w-80 text-white">
      <h3 class="text-xl font-semibold mb-4" style="color:var(--accent-color)">Settings</h3>

      <!-- Theme -->
      <div class="flex items-center justify-between mb-4">
        <span>Dark Mode</span>
        <label class="inline-flex items-center cursor-pointer">
          <input type="checkbox" id="themeToggle" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-700 rounded-full relative">
            <span class="absolute left-1 top-1 bg-black w-4 h-4 rounded-full transition-all"></span>
          </div>
        </label>
      </div>

      <!-- Accent -->
      <div class="mb-4">
        <label class="block mb-1">Accent Color</label>
        <input id="accentColorPicker" type="color" value="#00ffff" class="w-full h-8 cursor-pointer" />
      </div>

      <!-- Text color for widgets -->
      <div class="mb-4">
        <label class="block mb-1">Widget Text Color</label>
        <input id="textColorPicker" type="color" value="#ffffff" class="w-full h-8 cursor-pointer" />
      </div>

      <!-- Font picker -->
      <div class="mb-4">
        <label class="block mb-1">Font Family</label>
        <input id="fontPicker" type="text" placeholder="e.g., Arial, 'Courier New', sans-serif" class="w-full p-1 rounded text-black" />
      </div>
      <button id="applyFont" class="bg-cyan-400 text-black px-4 py-2 rounded w-full mb-2">Apply Font</button>

      <!-- Dynamic Island controls -->
      <div class="mb-2">
        <label class="inline-flex items-center mb-1">
          <input id="dynUseGradient" type="checkbox" class="mr-2" /> Use Gradient for Dynamic Island
        </label>
      </div>

      <div class="mb-4">
        <label class="block mb-1">Gradient Start</label>
        <input id="dynGradStart" type="color" value="#000000" class="w-full h-8 cursor-pointer" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">Gradient End</label>
        <input id="dynGradEnd" type="color" value="#00ffff" class="w-full h-8 cursor-pointer" />
      </div>

      <div class="mb-4">
        <label class="block mb-1">Fallback Solid Background</label>
        <input id="dynBgColorPicker" type="color" value="#000000" class="w-full h-8 cursor-pointer" />
      </div>

      <div class="mb-4">
        <label class="block mb-1">Dynamic Island Text</label>
        <input id="dynTextColorPicker" type="color" value="#00ffff" class="w-full h-8 cursor-pointer" />
      </div>

      <!-- Background media -->
      <div class="mb-4">
        <label class="block mb-1">Background Media (URL)</label>
        <input id="backgroundMedia" type="text" placeholder="Paste image/video URL" class="w-full p-1 rounded text-black" />
      </div>
      <button id="applyBackground" class="bg-cyan-400 text-black px-4 py-2 rounded w-full mb-2">Apply</button>

      <button onclick="closeSettings()" class="w-full bg-cyan-500 text-black py-2 rounded">Close</button>
    </div>
  </div>

<script>
/* ---------- Helpers & initial values ---------- */

// Live clock
function updateClock(){
  const el = document.getElementById('islandTime');
  const now = new Date();
  el.textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// Guest user placeholder
let user = localStorage.getItem('loggedInUser') || 'Guest';
localStorage.setItem('loggedInUser', user);

// Short selectors
const dynIsland = document.getElementById('dynIsland');
const islandWrap = document.getElementById('islandWrap');

/* ---------- Dynamic Island position (draggable + saved) ---------- */
let islandPos = JSON.parse(localStorage.getItem('islandPos')) || { top: 14, left: Math.round(window.innerWidth/2 - 60) };
islandWrap.style.top = islandPos.top + 'px';
islandWrap.style.left = islandPos.left + 'px';

let draggingIsland = false;
let offsetX = 0, offsetY = 0;
islandWrap.addEventListener('mousedown', (e) => {
  draggingIsland = true;
  offsetX = e.clientX - islandWrap.offsetLeft;
  offsetY = e.clientY - islandWrap.offsetTop;
  islandWrap.classList.add('dragging');
});
document.addEventListener('mouseup', () => {
  if (draggingIsland) {
    draggingIsland = false;
    islandWrap.classList.remove('dragging');
    localStorage.setItem('islandPos', JSON.stringify({
      top: parseInt(islandWrap.style.top || 0, 10),
      left: parseInt(islandWrap.style.left || 0, 10)
    }));
  }
});
document.addEventListener('mousemove', (e) => {
  if (!draggingIsland) return;
  let x = e.clientX - offsetX;
  let y = e.clientY - offsetY;
  const GRID = 20;
  x = Math.round(x / GRID) * GRID;
  y = Math.round(y / GRID) * GRID;
  x = Math.max(0, Math.min(x, window.innerWidth - islandWrap.offsetWidth));
  y = Math.max(0, Math.min(y, window.innerHeight - islandWrap.offsetHeight));
  islandWrap.style.left = x + 'px';
  islandWrap.style.top = y + 'px';
  // live save
  localStorage.setItem('islandPos', JSON.stringify({ top: y, left: x }));
});

/* ---------- Widgets (predefined only) - drag & save ---------- */
const GRID_SIZE = 20;
let widgets = JSON.parse(localStorage.getItem('widgets')) || [
  { id: 'assignmentsWidget', top: 100, left: 100, title: 'Assignments', content: '', width: 220, height: 120 }
];
// apply saved positions to DOM element if present
function createWidget(wdata){
  const el = document.getElementById(wdata.id);
  if (!el) return;
  el.style.top = wdata.top + 'px';
  el.style.left = wdata.left + 'px';
  el.style.width = (wdata.width || 220) + 'px';
  el.style.height = (wdata.height || 120) + 'px';
  makeDraggable(el.id);
}
// ensure localStorage contains widgets
localStorage.setItem('widgets', JSON.stringify(widgets));
widgets.forEach(createWidget);

// draggable function
function makeDraggable(widgetId){
  const w = document.getElementById(widgetId);
  if (!w) return;
  let dragging = false, wx = 0, wy = 0;
  w.addEventListener('mousedown', (e) => {
    dragging = true;
    wx = e.clientX - w.offsetLeft;
    wy = e.clientY - w.offsetTop;
    w.classList.add('dragging');
  });
  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      w.classList.remove('dragging');
    }
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    let x = e.clientX - wx;
    let y = e.clientY - wy;
    x = Math.round(x / GRID_SIZE) * GRID_SIZE;
    y = Math.round(y / GRID_SIZE) * GRID_SIZE;
    x = Math.max(0, Math.min(x, window.innerWidth - w.offsetWidth));
    y = Math.max(0, Math.min(y, window.innerHeight - w.offsetHeight));
    w.style.left = x + 'px';
    w.style.top = y + 'px';
    const idx = widgets.findIndex(it => it.id === widgetId);
    if (idx !== -1) {
      widgets[idx].top = y;
      widgets[idx].left = x;
      localStorage.setItem('widgets', JSON.stringify(widgets));
    }
  });
}

/* ---------- SETTINGS ELEMENTS ---------- */
const openSettings = () => document.getElementById('settingsModal').classList.remove('hidden');
const closeSettings = () => document.getElementById('settingsModal').classList.add('hidden');
const logout = () => { localStorage.setItem('loggedInUser', 'Guest'); alert('Logged out — Guest mode'); };

window.openSettings = openSettings;
window.closeSettings = closeSettings;
window.logout = logout;

/* Theme toggle */
const themeToggle = document.getElementById('themeToggle');
if (localStorage.getItem('theme') === 'dark') { document.documentElement.classList.add('dark'); themeToggle.checked = true; }
themeToggle.addEventListener('change', (e) => {
  if (e.target.checked) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
  else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
});

/* Accent color */
const accentPicker = document.getElementById('accentColorPicker');
function updateAccentColor(c){
  document.documentElement.style.setProperty('--accent-color', c);
  const di = document.querySelector('.dyn-island');
  if (di) di.style.boxShadow = `0 10px 30px ${c}80`;
  const side = document.querySelector('.sidebar');
  if (side) { side.style.borderLeftColor = c + '30'; side.style.color = c; }
}
const savedAccent = localStorage.getItem('accentColor');
if (savedAccent) { accentPicker.value = savedAccent; updateAccentColor(savedAccent); }
accentPicker.addEventListener('input', (e) => { updateAccentColor(e.target.value); localStorage.setItem('accentColor', e.target.value); });

/* Widget text color */
const textColorPicker = document.getElementById('textColorPicker');
function updateTextColor(c){
  document.documentElement.style.setProperty('--text-color', c);
  document.querySelectorAll('.widget').forEach(w => w.style.color = c);
}
const savedText = localStorage.getItem('textColor');
if (savedText) { textColorPicker.value = savedText; updateTextColor(savedText); }
textColorPicker.addEventListener('input', (e) => { updateTextColor(e.target.value); localStorage.setItem('textColor', e.target.value); });

/* Font picker */
const fontInput = document.getElementById('fontPicker');
const applyFontBtn = document.getElementById('applyFont');
function updateFont(font){
  document.body.style.fontFamily = font;
}
const savedFont = localStorage.getItem('dashboardFont');
if (savedFont) { fontInput.value = savedFont; updateFont(savedFont); }
applyFontBtn.addEventListener('click', () => {
  const f = (fontInput.value || 'Arial, sans-serif').trim();
  updateFont(f);
  localStorage.setItem('dashboardFont', f);
});

/* Background image / video */
const bgInput = document.getElementById('backgroundMedia');
const applyBgBtn = document.getElementById('applyBackground');
applyBgBtn.addEventListener('click', () => {
  const url = (bgInput.value || '').trim();
  if (!url) {
    document.body.style.background = '#121212';
    document.body.style.backgroundSize = 'cover';
    localStorage.removeItem('backgroundMedia');
    return;
  }
  if (url.match(/\.(mp4|webm|ogg)(\?.*)?$/i)) {
    let v = document.getElementById('bgVideo');
    if (!v) {
      v = document.createElement('video');
      v.id = 'bgVideo';
      v.autoplay = true; v.loop = true; v.muted = true;
      v.style.position = 'fixed'; v.style.top = '0'; v.style.left = '0';
      v.style.width = '100%'; v.style.height = '100%'; v.style.objectFit = 'cover';
      v.style.zIndex = '-1';
      document.body.appendChild(v);
    }
    v.src = url;
  } else {
    document.body.style.background = `url(${url}) no-repeat center center fixed`;
    document.body.style.backgroundSize = 'cover';
  }
  localStorage.setItem('backgroundMedia', url);
});
const savedBg = localStorage.getItem('backgroundMedia');
if (savedBg) { bgInput.value = savedBg; applyBgBtn.click(); }

/* ---------- Dynamic Island color / gradient controls ---------- */
const dynUseGradient = document.getElementById('dynUseGradient');
const dynGradStart = document.getElementById('dynGradStart');
const dynGradEnd = document.getElementById('dynGradEnd');
const dynBgPicker = document.getElementById('dynBgColorPicker');
const dynTextPicker = document.getElementById('dynTextColorPicker');

function applyDynAppearance(){
  const useGrad = localStorage.getItem('dynUseGradient') === 'true';
  const start = localStorage.getItem('dynGradStart') || dynGradStart.value;
  const end = localStorage.getItem('dynGradEnd') || dynGradEnd.value;
  const solid = localStorage.getItem('dynBgColor') || dynBgPicker.value;
  const text = localStorage.getItem('dynTextColor') || dynTextPicker.value;

  if (useGrad) {
    dynIsland.style.background = `linear-gradient(90deg, ${start}, ${end})`;
  } else {
    dynIsland.style.background = solid;
  }
  dynIsland.style.color = text;
}

// load saved settings into controls and apply
const savedUseGrad = localStorage.getItem('dynUseGradient');
if (savedUseGrad) dynUseGradient.checked = savedUseGrad === 'true';

const savedGradStart = localStorage.getItem('dynGradStart');
if (savedGradStart) dynGradStart.value = savedGradStart;

const savedGradEnd = localStorage.getItem('dynGradEnd');
if (savedGradEnd) dynGradEnd.value = savedGradEnd;

const savedDynBg = localStorage.getItem('dynBgColor');
if (savedDynBg) dynBgPicker.value = savedDynBg;

const savedDynText = localStorage.getItem('dynTextColor');
if (savedDynText) dynTextPicker.value = savedDynText;

applyDynAppearance();

// listeners that save & apply
dynUseGradient.addEventListener('change', (e) => {
  localStorage.setItem('dynUseGradient', e.target.checked ? 'true' : 'false');
  applyDynAppearance();
});
dynGradStart.addEventListener('input', (e) => {
  localStorage.setItem('dynGradStart', e.target.value);
  applyDynAppearance();
});
dynGradEnd.addEventListener('input', (e) => {
  localStorage.setItem('dynGradEnd', e.target.value);
  applyDynAppearance();
});
dynBgPicker.addEventListener('input', (e) => {
  localStorage.setItem('dynBgColor', e.target.value);
  applyDynAppearance();
});
dynTextPicker.addEventListener('input', (e) => {
  localStorage.setItem('dynTextColor', e.target.value);
  applyDynAppearance();
});

/* Accent & text color initial application (ensure consistent look) */
if (savedAccent) updateAccentColor(savedAccent);
if (savedText) updateTextColor(savedText);

/* Ensure widgets positions are saved already (if none) */
if (!localStorage.getItem('widgets')) localStorage.setItem('widgets', JSON.stringify(widgets));

</script>
</body>
</html>
